name: 'engines-gauge'
description: 'Ensure engines.node, CI matrix, .nvmrc and dependency engine requirements agree'
author: 'Louis Wright'
branding: { icon: 'cpu', color: 'blue' }
inputs:
  path: { description: 'Project directory (default: repository root)', default: '.' }
  fail-on: { description: 'critical | high | medium | low | info | none', default: 'high' }
  config: { description: 'Path to JSON config file', default: '' }
  sarif: { description: 'Write SARIF to this path', default: '' }
  json: { description: 'Write JSON report to this path', default: '' }
  job-summary: { description: 'Write the Markdown report to the job summary (true/false)', default: 'true' }
  args: { description: 'Extra CLI arguments', default: '' }
outputs:
  markdown-file: { description: 'Path of the Markdown report', value: '${{ steps.run.outputs.markdown-file }}' }
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20' }
    - id: run
      shell: bash
      env:
        EG_PATH: ${{ inputs.path }}
        EG_FAIL_ON: ${{ inputs.fail-on }}
        EG_CONFIG: ${{ inputs.config }}
        EG_SARIF: ${{ inputs.sarif }}
        EG_JSON: ${{ inputs.json }}
        EG_SUMMARY: ${{ inputs.job-summary }}
        EG_ARGS: ${{ inputs.args }}
        EG_BIN: ${{ github.action_path }}/bin/engines-gauge.js
      run: |
        md="$RUNNER_TEMP/engines-gauge.md"
        args=("$EG_PATH" --fail-on "$EG_FAIL_ON" --markdown "$md")
        [ -n "$EG_CONFIG" ] && args+=(--config "$EG_CONFIG")
        [ -n "$EG_SARIF" ] && args+=(--sarif "$EG_SARIF")
        [ -n "$EG_JSON" ] && args+=(--json "$EG_JSON")
        set +e
        # shellcheck disable=SC2086
        node "$EG_BIN" "${args[@]}" $EG_ARGS
        code=$?
        set -e
        echo "markdown-file=$md" >> "$GITHUB_OUTPUT"
        if [ "$EG_SUMMARY" = "true" ] && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
